[program:php-fpm]
command=php-fpm --nodaemonize
priority=10
autostart=true
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:apache2]
command=apache2-foreground
priority=20
autostart=true
autorestart=true
stopsignal=WINCH
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wp-cron]
command=/usr/local/bin/wp-cron-loop
priority=30
user=%(ENV_PHP_FPM_USER)s
environment=HOME="/var/www",USER="%(ENV_PHP_FPM_USER)s"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wp-provision]
command=/usr/local/bin/wp-provision
priority=30
autostart=true
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
