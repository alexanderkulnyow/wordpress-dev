version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/.docker/apache"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker):"
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/.docker/apache-fpm"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(docker):"
    open-pull-requests-limit: 5
