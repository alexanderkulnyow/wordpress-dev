name: Build and push Docker image

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker prod image
        uses: docker/build-push-action@v6
        with:
          context: .docker
          push: ${{ github.ref == 'refs/heads/main' }}
          platforms: linux/amd64,linux/arm64/v8
          build-args: |
              APP_ENV=prod
          tags: |
            alexanderkulnyow/wordpress-prod:latest
            alexanderkulnyow/wordpress-prod:${{ github.sha }}
            ghcr.io/alexanderkulnyow/wordpress-prod:latest
            ghcr.io/alexanderkulnyow/wordpress-prod:${{ github.sha }}

      - name: Build and push Docker dev image
        uses: docker/build-push-action@v6
        with:
            context: .docker
            push: ${{ github.ref == 'refs/heads/main' }}
            platforms: linux/amd64,linux/arm64/v8
            build-args: |
                APP_ENV=dev
            tags: |
                alexanderkulnyow/wordpress-dev:latest
                alexanderkulnyow/wordpress-dev:${{ github.sha }}
                ghcr.io/alexanderkulnyow/wordpress-dev:latest
                ghcr.io/alexanderkulnyow/wordpress-dev:${{ github.sha }}
